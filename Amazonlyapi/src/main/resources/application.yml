spring:
    application:
        name: Amazonlyapi

    datasource:
        url: jdbc:mysql://localhost:3306/amazonly
        username: root
        password: "0000"
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect

server:
    port: 8080
    servlet:
        context-path: /amazonly